name: 发布 Docker 镜像

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 确认新固定标签未被占用
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://hub.docker.com/v2/repositories/${REGISTRY_USER}/vmp-backend/tags/${version}/"
          status="$(curl --silent --show-error --retry 3 --max-time 30 --output "${RUNNER_TEMP}/vmp-tag-check.json" --write-out '%{http_code}' "$url")"
          case "$status" in
            404) echo "目标固定版本不存在，允许发布。" ;;
            200) echo "目标固定版本已经存在，拒绝覆盖旧镜像。" >&2; exit 1 ;;
            *) echo "无法确认固定版本是否存在，HTTP $status；停止发布。" >&2; exit 1 ;;
          esac

      - name: 启用多架构模拟
        uses: docker/setup-qemu-action@v3

      - name: 初始化 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/vmp-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证双架构发布清单
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          image="${REGISTRY_USER}/vmp-backend:${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "$image"
          docker buildx imagetools inspect --raw "$image" | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] as $platforms | ($platforms | index("amd64") != null) and ($platforms | index("arm64") != null)'
