services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vmlease}
      POSTGRES_USER: ${POSTGRES_USER:-vmlease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vmlease-dev}
    volumes:
      # 数据库数据持久化到独立数据卷。
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ${LISTEN_ADDR:-:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-vmlease}:${POSTGRES_PASSWORD:-vmlease-dev}@postgres:5432/${POSTGRES_DB:-vmlease}?sslmode=disable
      AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:-dev-bootstrap-token}
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:-dev-agent-token}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      CONSOLE_SIGNING_KEY: ${CONSOLE_SIGNING_KEY:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_LOGIN_FILTER: ${LDAP_LOGIN_FILTER:-(uid=%s)}
      LDAP_SYNC_FILTER: ${LDAP_SYNC_FILTER:-(objectClass=person)}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-uid}
      LDAP_DISPLAY_NAME_ATTRIBUTE: ${LDAP_DISPLAY_NAME_ATTRIBUTE:-cn}
      LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-mail}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
