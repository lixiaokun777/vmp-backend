name: vmlease

services:
  control-plane:
    image: ${VMP_BACKEND_IMAGE:-lixiaokun/vmp-backend:0.5.0}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL}
      AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:?请生成至少32字符随机引导令牌}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      CONSOLE_SIGNING_KEY: ${CONSOLE_SIGNING_KEY}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_LOGIN_FILTER: ${LDAP_LOGIN_FILTER:-(uid=%s)}
      LDAP_SYNC_FILTER: ${LDAP_SYNC_FILTER:-(objectClass=person)}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-uid}
      LDAP_DISPLAY_NAME_ATTRIBUTE: ${LDAP_DISPLAY_NAME_ATTRIBUTE:-cn}
      LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-mail}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  web:
    image: ${VMP_FRONTEND_IMAGE:-lixiaokun/vmp-frontend:0.5.0}
    restart: unless-stopped
    ports:
      - "${VMP_HTTP_BIND:-0.0.0.0}:${VMP_HTTP_PORT:-8080}:80"
    depends_on:
      control-plane:
        condition: service_healthy
    logging:
      options:
        max-size: "20m"
        max-file: "5"
